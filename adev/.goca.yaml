# Enterprise Project Configuration
# Production-ready with comprehensive features

project:
  name: adev
  module: github.com/Reddetk/Adev
  description: Enterprise application built with Clean Architecture
  version: 1.0.0

database:
  type: postgres
  migrations:
    enabled: true
    auto_generate: true
    versioning: timestamp
  connection:
    max_open: 100
    max_idle: 10
  features:
    soft_delete: true
    timestamps: true
    uuid: true
    audit: true
    versioning: true
    partitioning: false

architecture:
  layers:
    domain:
      enabled: true
    usecase:
      enabled: true
    repository:
      enabled: true
    handler:
      enabled: true
  
  patterns:
    - repository
    - service
    - dto
    - specification
  
  naming:
    files: lowercase
    entities: PascalCase
    variables: camelCase
    functions: PascalCase
    constants: SCREAMING_SNAKE

generation:
  validation:
    enabled: true
    library: validator
    sanitize: true
    transform: true
  
  business_rules:
    enabled: true
    patterns:
      - validation
      - authorization
    events: true
    guards: true
  
  documentation:
    swagger:
      enabled: true
      version: "3.0"
      title: "Enterprise API"
    postman:
      enabled: true
      environment: true
      tests: true
    markdown:
      enabled: true
      toc: true
      examples: true
    comments:
      enabled: true
      language: english
      style: godoc
      examples: true

  style:
    gofmt: true
    goimports: true
    golint: true
    staticcheck: true

testing:
  enabled: true
  framework: testify
  coverage:
    enabled: true
    threshold: 85
    format: html
  mocks:
    enabled: true
    tool: testify
  integration: true
  benchmarks: true
  examples: true
  fixtures:
    enabled: true
    seeds: true
    factories: 
      - user
      - admin

templates:
  directory: .goca/templates

features:
  auth:
    enabled: true
    type: jwt
    providers:
      - local
      - oauth2
    rbac: true
    middleware: true
  
  cache:
    enabled: true
    type: redis
    ttl: 1h
    layers:
      - query
      - entity
  
  logging:
    enabled: true
    level: info
    format: json
    output:
      - stdout
      - file
    structured: true
    tracing: true
  
  monitoring:
    enabled: true
    metrics: true
    tracing: true
    health_check: true
    profiling: true
    tools:
      - prometheus
  
  security:
    https: true
    cors: true
    rate_limit: true
    validation: true
    sanitization: true
    headers:
      - X-Content-Type-Options
      - X-Frame-Options
      - X-XSS-Protection

deploy:
  docker:
    enabled: true
    multistage: true
    compose: true
  
  kubernetes:
    enabled: true
    manifests: k8s
    helm: true
    ingress: true
    config_maps: true
    secrets: true
  
  ci:
    enabled: true
    provider: github-actions
    workflows:
      - test
      - build
      - deploy
    tests: true
    build: true
    deploy: true
