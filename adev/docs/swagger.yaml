basePath: /api/v1
definitions:
  domain.AgentView:
    properties:
      baseUrl:
        type: string
      hasApiKey:
        type: boolean
      maxTokens:
        type: integer
      model:
        type: string
      provider:
        $ref: '#/definitions/domain.Provider'
      role:
        $ref: '#/definitions/domain.Role'
      temperature:
        type: number
    type: object
  domain.AuditEvent:
    properties:
      createdat:
        type: string
      eventtype:
        type: string
      id:
        type: integer
      pipelineid:
        minimum: 0
        type: integer
      runid:
        minimum: 0
        type: integer
    required:
    - eventtype
    - pipelineid
    - runid
    type: object
  domain.FormType:
    enum:
    - USER_INPUT
    - BRD
    - FEASIBILITY
    - CR_BRIEF
    - IMPACT_ASSESSMENT
    - SRS
    - HLD
    - ADR
    - LLD
    - TASK_PLAN
    - TEST_CONTRACT
    - IMPLEMENTATION_SPEC
    - VERDICT
    - REFACTOR_SPEC
    - QUESTION
    type: string
    x-enum-varnames:
    - TypeUserInput
    - TypeBRD
    - TypeFeasibility
    - TypeCRBrief
    - TypeImpactAssessment
    - TypeSRS
    - TypeHLD
    - TypeADR
    - TypeLLD
    - TypeTaskPlan
    - TypeTestContract
    - TypeImplementationSpec
    - TypeVerdict
    - TypeRefactorSpec
    - TypeQuestion
  domain.Mode:
    enum:
    - full
    - delta
    type: string
    x-enum-varnames:
    - ModeFull
    - ModeDelta
  domain.ModelCall:
    properties:
      cost:
        minimum: 0
        type: number
      id:
        type: integer
      latencyms:
        minimum: 0
        type: integer
      model:
        type: string
      profile:
        type: string
      runid:
        minimum: 0
        type: integer
      tokensin:
        minimum: 0
        type: integer
      tokensout:
        minimum: 0
        type: integer
    required:
    - model
    - profile
    - runid
    type: object
  domain.OperatorRequest:
    properties:
      blocking:
        type: boolean
      id:
        type: integer
      pipelineid:
        minimum: 0
        type: integer
      pointer:
        type: string
      question:
        type: string
      status:
        type: string
    required:
    - pipelineid
    - pointer
    - question
    - status
    type: object
  domain.Pipeline:
    properties:
      currentstage:
        type: string
      id:
        type: integer
      route:
        type: string
      status:
        type: string
      targetsystemid:
        minimum: 0
        type: integer
    required:
    - currentstage
    - route
    - status
    - targetsystemid
    type: object
  domain.Provider:
    enum:
    - openai
    - ollama
    - openrouter
    - qwen
    - deepseek
    - ark
    type: string
    x-enum-varnames:
    - ProviderOpenAI
    - ProviderOllama
    - ProviderOpenRouter
    - ProviderQwen
    - ProviderDeepSeek
    - ProviderArk
  domain.Readiness:
    properties:
      missing:
        items:
          type: string
        type: array
      ready:
        type: boolean
    type: object
  domain.Ref:
    properties:
      formId:
        type: string
      formType:
        $ref: '#/definitions/domain.FormType'
      formVersion:
        type: integer
      hash:
        type: string
      pointer:
        type: string
    type: object
  domain.Role:
    enum:
    - operator
    - analyst
    - architect
    - qa
    - dev
    - devops
    type: string
    x-enum-varnames:
    - RoleOperator
    - RoleAnalyst
    - RoleArchitect
    - RoleQA
    - RoleDev
    - RoleDevOps
  domain.Route:
    enum:
    - greenfield
    - change
    type: string
    x-enum-varnames:
    - RouteGreenfield
    - RouteChange
  domain.Run:
    properties:
      attempts:
        minimum: 0
        type: integer
      checkpointid:
        type: string
      id:
        type: integer
      lasterror:
        type: string
      pipelineid:
        minimum: 0
        type: integer
      stage:
        type: string
      status:
        type: string
    required:
    - checkpointid
    - pipelineid
    - stage
    - status
    type: object
  domain.Stage:
    properties:
      id:
        type: string
      inputs:
        items:
          $ref: '#/definitions/domain.FormType'
        type: array
      name:
        type: string
      outputs:
        items:
          $ref: '#/definitions/domain.FormType'
        type: array
      owner:
        $ref: '#/definitions/domain.Role'
    type: object
  domain.Status:
    enum:
    - draft
    - valid
    - waiting_operator
    - approved
    - rejected
    - superseded
    type: string
    x-enum-varnames:
    - StatusDraft
    - StatusValid
    - StatusWaitingOperator
    - StatusApproved
    - StatusRejected
    - StatusSuperseded
  domain.TargetSystem:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      repourl:
        type: string
    required:
    - description
    - name
    type: object
  domain.Task:
    properties:
      contractref:
        type: string
      id:
        type: integer
      owner:
        type: string
      parentid:
        minimum: 0
        type: integer
      pipelineid:
        minimum: 0
        type: integer
      status:
        type: string
      tasktype:
        type: string
    required:
    - contractref
    - owner
    - pipelineid
    - status
    - tasktype
    type: object
  http.AgentListResponse:
    properties:
      agents:
        items:
          $ref: '#/definitions/domain.AgentView'
        type: array
    type: object
  http.AgentRequest:
    properties:
      apiKey:
        type: string
      baseUrl:
        example: http://localhost:11434
        type: string
      maxTokens:
        example: 8192
        type: integer
      model:
        example: qwen3-coder:30b
        type: string
      provider:
        example: ollama
        type: string
      temperature:
        example: 0.2
        type: number
    type: object
  http.AnswerRequest:
    type: object
  http.FormRequest:
    type: object
  http.PipelineCreatedResponse:
    properties:
      id:
        type: integer
      readiness:
        $ref: '#/definitions/domain.Readiness'
      route:
        $ref: '#/definitions/domain.Route'
      stage:
        type: string
    type: object
  http.PipelineRequest:
    properties:
      route:
        example: greenfield
        type: string
    type: object
  http.StageRunRequest:
    properties:
      pipelineId:
        example: "1"
        type: string
      route:
        example: greenfield
        type: string
    type: object
  http.StatusRequest:
    properties:
      status:
        allOf:
        - $ref: '#/definitions/domain.Status'
        example: valid
    type: object
  http.WorkspaceRequest:
    properties:
      dir:
        example: D:\work\demo
        type: string
    type: object
  http.WorkspaceResponse:
    properties:
      dir:
        type: string
    type: object
  usecase.CreateAuditEventInput:
    properties:
      createdat:
        type: string
      eventtype:
        type: string
      pipelineid:
        type: integer
      runid:
        type: integer
    type: object
  usecase.CreateAuditEventOutput:
    properties:
      createdat:
        type: string
      eventtype:
        type: string
      id:
        type: integer
      message:
        type: string
      pipelineid:
        type: integer
      runid:
        type: integer
    type: object
  usecase.CreateModelCallInput:
    properties:
      cost:
        type: number
      latencyms:
        type: integer
      model:
        type: string
      profile:
        type: string
      runid:
        type: integer
      tokensin:
        type: integer
      tokensout:
        type: integer
    type: object
  usecase.CreateModelCallOutput:
    properties:
      cost:
        type: number
      id:
        type: integer
      latencyms:
        type: integer
      message:
        type: string
      model:
        type: string
      profile:
        type: string
      runid:
        type: integer
      tokensin:
        type: integer
      tokensout:
        type: integer
    type: object
  usecase.CreateOperatorRequestInput:
    properties:
      blocking:
        type: boolean
      pipelineid:
        minimum: 1
        type: integer
      pointer:
        minLength: 1
        type: string
      question:
        minLength: 1
        type: string
      status:
        minLength: 1
        type: string
    required:
    - pipelineid
    - pointer
    - question
    - status
    type: object
  usecase.CreateOperatorRequestOutput:
    properties:
      blocking:
        type: boolean
      id:
        type: integer
      message:
        type: string
      pipelineid:
        type: integer
      pointer:
        type: string
      question:
        type: string
      status:
        type: string
    type: object
  usecase.CreatePipelineInput:
    properties:
      currentstage:
        minLength: 1
        type: string
      route:
        minLength: 1
        type: string
      status:
        minLength: 1
        type: string
      targetsystemid:
        minimum: 1
        type: integer
    required:
    - currentstage
    - route
    - status
    - targetsystemid
    type: object
  usecase.CreatePipelineOutput:
    properties:
      currentstage:
        type: string
      id:
        type: integer
      message:
        type: string
      route:
        type: string
      status:
        type: string
      targetsystemid:
        type: integer
    type: object
  usecase.CreateRunInput:
    properties:
      attempts:
        type: integer
      checkpointid:
        type: string
      lasterror:
        type: string
      pipelineid:
        type: integer
      stage:
        type: string
      status:
        type: string
    type: object
  usecase.CreateRunOutput:
    properties:
      attempts:
        type: integer
      checkpointid:
        type: string
      id:
        type: integer
      lasterror:
        type: string
      message:
        type: string
      pipelineid:
        type: integer
      stage:
        type: string
      status:
        type: string
    type: object
  usecase.CreateTargetSystemInput:
    properties:
      description:
        minLength: 1
        type: string
      name:
        minLength: 1
        type: string
      repourl:
        type: string
    required:
    - description
    - name
    type: object
  usecase.CreateTargetSystemOutput:
    properties:
      description:
        type: string
      id:
        type: integer
      message:
        type: string
      name:
        type: string
      repourl:
        type: string
    type: object
  usecase.CreateTaskInput:
    properties:
      contractref:
        type: string
      owner:
        type: string
      parentid:
        type: integer
      pipelineid:
        type: integer
      status:
        type: string
      tasktype:
        type: string
    type: object
  usecase.CreateTaskOutput:
    properties:
      contractref:
        type: string
      id:
        type: integer
      message:
        type: string
      owner:
        type: string
      parentid:
        type: integer
      pipelineid:
        type: integer
      status:
        type: string
      tasktype:
        type: string
    type: object
  usecase.ListAuditEventOutput:
    properties:
      auditevents:
        items:
          $ref: '#/definitions/domain.AuditEvent'
        type: array
      message:
        type: string
      total:
        type: integer
    type: object
  usecase.ListModelCallOutput:
    properties:
      message:
        type: string
      modelcalls:
        items:
          $ref: '#/definitions/domain.ModelCall'
        type: array
      total:
        type: integer
    type: object
  usecase.ListOperatorRequestOutput:
    properties:
      message:
        type: string
      operatorrequests:
        items:
          $ref: '#/definitions/domain.OperatorRequest'
        type: array
      total:
        type: integer
    type: object
  usecase.ListPipelineOutput:
    properties:
      message:
        type: string
      pipelines:
        items:
          $ref: '#/definitions/domain.Pipeline'
        type: array
      total:
        type: integer
    type: object
  usecase.ListRunOutput:
    properties:
      message:
        type: string
      runs:
        items:
          $ref: '#/definitions/domain.Run'
        type: array
      total:
        type: integer
    type: object
  usecase.ListTargetSystemOutput:
    properties:
      message:
        type: string
      targetsystems:
        items:
          $ref: '#/definitions/domain.TargetSystem'
        type: array
      total:
        type: integer
    type: object
  usecase.ListTaskOutput:
    properties:
      message:
        type: string
      tasks:
        items:
          $ref: '#/definitions/domain.Task'
        type: array
      total:
        type: integer
    type: object
  usecase.ModelCheckResult:
    properties:
      answer:
        type: string
      hasApiKey:
        type: boolean
      model:
        type: string
      provider:
        $ref: '#/definitions/domain.Provider'
      role:
        $ref: '#/definitions/domain.Role'
    type: object
  usecase.Plan:
    properties:
      readiness:
        $ref: '#/definitions/domain.Readiness'
      route:
        $ref: '#/definitions/domain.Route'
      stages:
        items:
          $ref: '#/definitions/domain.Stage'
        type: array
      targetSystemId:
        type: integer
    type: object
  usecase.StageOutcome:
    properties:
      attempts:
        type: integer
      blocked:
        type: boolean
      formId:
        type: string
      formVersion:
        type: integer
      gaps:
        description: |-
          Gaps lists why the model could not satisfy the gates. A blocked stage becomes
          an operator question in the next slice.
        items:
          type: string
        type: array
      stage:
        type: string
    type: object
  usecase.UpdateAuditEventInput:
    properties:
      createdat:
        type: string
      eventtype:
        type: string
      pipelineid:
        type: integer
      runid:
        type: integer
    type: object
  usecase.UpdateModelCallInput:
    properties:
      cost:
        type: number
      latencyms:
        type: integer
      model:
        type: string
      profile:
        type: string
      runid:
        type: integer
      tokensin:
        type: integer
      tokensout:
        type: integer
    type: object
  usecase.UpdateOperatorRequestInput:
    properties:
      blocking:
        type: boolean
      pipelineid:
        minimum: 1
        type: integer
      pointer:
        minLength: 1
        type: string
      question:
        minLength: 1
        type: string
      status:
        minLength: 1
        type: string
    type: object
  usecase.UpdatePipelineInput:
    properties:
      currentstage:
        minLength: 1
        type: string
      route:
        minLength: 1
        type: string
      status:
        minLength: 1
        type: string
      targetsystemid:
        minimum: 1
        type: integer
    type: object
  usecase.UpdateRunInput:
    properties:
      attempts:
        type: integer
      checkpointid:
        type: string
      lasterror:
        type: string
      pipelineid:
        type: integer
      stage:
        type: string
      status:
        type: string
    type: object
  usecase.UpdateTargetSystemInput:
    properties:
      description:
        minLength: 1
        type: string
      name:
        minLength: 1
        type: string
      repourl:
        minLength: 1
        type: string
    type: object
  usecase.UpdateTaskInput:
    properties:
      contractref:
        type: string
      owner:
        type: string
      parentid:
        type: integer
      pipelineid:
        type: integer
      status:
        type: string
      tasktype:
        type: string
    type: object
info:
  contact: {}
  description: 'Control plane of adev: target systems, pipelines, forms, runs, operator
    requests.'
  title: adev API
  version: "1.0"
paths:
  /auditevents:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.ListAuditEventOutput'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List auditevents
      tags:
      - auditevents
    post:
      consumes:
      - application/json
      parameters:
      - description: AuditEvent payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usecase.CreateAuditEventInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/usecase.CreateAuditEventOutput'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create auditevent
      tags:
      - auditevents
  /auditevents/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: AuditEvent ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete auditevent
      tags:
      - auditevents
    get:
      consumes:
      - application/json
      parameters:
      - description: AuditEvent ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuditEvent'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get auditevent by ID
      tags:
      - auditevents
    put:
      consumes:
      - application/json
      parameters:
      - description: AuditEvent ID
        in: path
        name: id
        required: true
        type: integer
      - description: AuditEvent payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usecase.UpdateAuditEventInput'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update auditevent
      tags:
      - auditevents
  /forms:
    post:
      consumes:
      - application/json
      parameters:
      - description: Form envelope and payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.FormRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Stored form
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: This form version already exists
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: A gate rejected the form
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Submit a form version
      tags:
      - forms
  /forms/{formId}/latest:
    get:
      parameters:
      - description: Form ID
        in: path
        name: formId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Stored form
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read the latest form version
      tags:
      - forms
  /forms/{formId}/versions/{version}:
    get:
      parameters:
      - description: Form ID
        in: path
        name: formId
        required: true
        type: string
      - description: Form version
        in: path
        name: version
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Stored form
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read one form version
      tags:
      - forms
  /forms/{formId}/versions/{version}/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: Form ID
        in: path
        name: formId
        required: true
        type: string
      - description: Form version
        in: path
        name: version
        required: true
        type: integer
      - description: New status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.StatusRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: The lifecycle forbids this change
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Change the status of a form version
      tags:
      - forms
  /logs:
    get:
      parameters:
      - default: 200
        description: How many lines to return, newest kept
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Recent server log lines
      tags:
      - logs
  /modelcalls:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.ListModelCallOutput'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List modelcalls
      tags:
      - modelcalls
    post:
      consumes:
      - application/json
      parameters:
      - description: ModelCall payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usecase.CreateModelCallInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/usecase.CreateModelCallOutput'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create modelcall
      tags:
      - modelcalls
  /modelcalls/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: ModelCall ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
